# Retrieval config: the retrievers `index` builds and `evaluate` scores (ADR 0039).
#
# Each retriever's settings, with the chunking config hash, name its folder in the index cache, so a
# change here makes `index` build that retriever again and leaves the old index where it was.

# BM25 over each Chunk's context header plus its text. Tokens are lower-cased runs of letters and
# digits ("SentencePiece" -> "sentencepiece", "50k" -> "50k", "BPE-dropout" -> "bpe", "dropout"),
# numbers kept ("0.1" -> "0.1"), with no stemming and no stop words, so exact terms stay distinctive.
[bm25]
k1 = 1.2  # how fast a term's weight saturates with its count in a Chunk
b = 0.75  # how much a long Chunk's counts are discounted

# The dense retrievers (ADRs 0042 and 0050), one table each, named `dense.<name>` for `--retriever`. Each embeds
# every Chunk's context header plus its text once, and a query is scored against every Chunk by exact dot
# product. A table pins its model, as the chunking tokenizer is pinned: the repo, its revision and the sha256
# of its weights file, model.safetensors or, in a repo without one, pytorch_model.bin (ADR 0052). It also says
# how the model is used:
#   pooling            "cls" (the last layer's [CLS] vector) or "mean" (the last layer's mean over the
#                      tokens that aren't padding), L2-normalised either way
#   max_tokens         a longer text is cut to its first max_tokens tokens
#   query_instruction  put in front of every query, never in front of a Chunk ("" for none)
# Every field but the table's name is in its key in the index cache, so a change builds that table's index
# again and leaves the others alone. It runs on MPS when the machine has it, otherwise on the CPU.

# The baseline: BAAI/bge-small-en-v1.5 (384 dimensions, 512 tokens, the same uncased BERT WordPiece
# vocabulary the chunker counts with), used as its model card specifies. Its CPU and MPS vectors agree to
# within 5.1e-7 per dimension.
[dense.bge-small]
model = "BAAI/bge-small-en-v1.5"
revision = "5c38ec7c405ec4b44b94cc5a9bb96e735b38267a"
model_sha256 = "3c9f31665447c8911517620762200d2245a2518d6e7208acc78cd9db317e21ad"
pooling = "cls"
max_tokens = 512
query_instruction = "Represent this sentence for searching relevant passages: "

# The size control: BAAI/bge-base-en-v1.5, bge-small's larger sibling (110M parameters, 768 dimensions, 512
# tokens, the same vocabulary), used as its model card specifies, as bge-small is. A gain over bge-small is
# what size alone buys (spec #55).
[dense.bge-base]
model = "BAAI/bge-base-en-v1.5"
revision = "a5beb1e3e68b9ab74eb54cfd186867f64f240e1a"
model_sha256 = "c7c1988aae201f80cf91a5dbbd5866409503b89dcaba877ca6dba7dd0a5167d7"
pooling = "cls"
max_tokens = 512
query_instruction = "Represent this sentence for searching relevant passages: "

# The scientific candidate: OpenScholar/OpenScholar_Retriever, Contriever-base (110M parameters, 768
# dimensions, the same vocabulary) trained further on peS2o's scientific papers. Pooled as Contriever's
# reference code pools, the mean over non-padding tokens, with no query instruction. Contriever scores by raw
# inner product; normalised here like the others, which changes the top 10 of every fixture question in the
# opt-in test (ADR 0052). Its repo holds only pytorch_model.bin, which is what the sha256 is of.
[dense.openscholar]
model = "OpenScholar/OpenScholar_Retriever"
revision = "ef4f3120d33b3ca57e12fce2b369f5982a7bb929"
model_sha256 = "fb5226976e362e070ad5b3f6c5bd38ed03a770b7d349b9334e4db8d61cc5f8fa"
pooling = "mean"
max_tokens = 512
query_instruction = ""

# The hybrids (ADR 0058), one per dense table, named `hybrid.<name>` for `--retriever`: BM25 and that dense table,
# fused by reciprocal rank fusion. A query takes each member's top `pool` Chunks, scores each Chunk by the sum of
# 1 / (k + rank) over the members that ranked it, and ranks by that sum; a tie goes to the member listed first.
# A hybrid stores no vectors: its index points to its members' indexes, and `index` builds a missing member first.
#   members  bm25 and one dense table, by their `--retriever` names
#   k        the RRF constant; 60, the value Cormack, Clarke and Büttcher (2009) fixed after a pilot run
#   pool     how many Chunks each member ranks for a query
# The members' keys are part of the hybrid's key, so a change to a member builds the hybrid's record again too.
[hybrid."bm25+bge-small"]
members = ["bm25", "dense.bge-small"]
k = 60
pool = 100

[hybrid."bm25+bge-base"]
members = ["bm25", "dense.bge-base"]
k = 60
pool = 100

[hybrid."bm25+openscholar"]
members = ["bm25", "dense.openscholar"]
k = 60
pool = 100

# The Collapsed ranking (ADRs 0053, 0057 and 0072): `evaluate` scores every retriever above beside its `<name>+collapsed`
# twin, which asks the retriever for its top `pool` Chunks, merges copies of a passage from a Work's other files
# (the manifest's work_id), and fills the top k from them in the raw order. A pool that holds fewer than k distinct
# Chunks leaves the top k short; the eval report counts the queries where it did. It changes no index.
#   pool     how many raw Chunks the twin merges copies in
#   overlap  two Chunks of one Work from different files are copies when they share at least this share of their
#            word 5-grams (lower-cased runs of letters and digits), counted on the smaller Chunk's, and one of
#            them is the other's closest Chunk in its file
[collapse]
pool = 50
overlap = 0.4

# The eval report's Comparison (spec #55, ADR 0061): every retriever against `baseline`, and every `+collapsed` twin
# against the baseline's twin, on the answerable questions as a user asks them. It counts the questions each wins,
# ties and loses on Recall@5 and on MRR@10, and gives 95% percentile bootstrap intervals on each mean and on the
# paired difference from the baseline: `resamples` draws of the questions with replacement, the same draws for every
# retriever, from a generator seeded with `seed`, so two runs give the same intervals. A difference whose interval
# holds 0 is within noise. The report names no winner: the decision rule of #55 is applied in an ADR.
[comparison]
baseline = "dense.bge-small"
resamples = 10000
seed = 55

# The chatbot (spec #63, ADR 0054). Each Turn retrieves k Chunks from the retriever named here, one of the
# retrievers above or its `+collapsed` twin (ADR 0069), and the answer model answers from them. dense.bge-small is
# the embedding comparison's choice: nothing beats it beyond noise on the raw or the Collapsed ranking (ADR 0065).
# The chatbot retrieves with its twin, so a Citation stands for every copy of the passage (ADR 0070).
[chat]
retriever = "dense.bge-small+collapsed"
k = 5
# The answer model: gemma4:e2b-mlx on Ollama, pinned as the judge is, as <digest>@<Ollama version> (ADR 0021).
# Thinking off and temperature 0, so the same question over the same Chunks gets the same answer.
model = "gemma4:e2b-mlx"
revision = "e98b54fe1913178321e1d9cd007d12a465de77a8f8eae37af69d2501ca03c6b5@0.40.5"
think = false
temperature = 0.0
# The fixed Abstention sentence: the prompt asks for it word for word, and an answer holding it (compared after
# the Passage matcher's normalisation) is counted as an Abstention, as is a one-sentence decline in the model's own
# words, "The provided chunks do not contain …" (ADR 0064).
abstention = "The papers in this corpus do not answer this question."
# Follow-ups (#65, ADR 0056): the answer model is shown the last `history` Turns of the Conversation before this
# Turn's question, each as its question and its answer's text without the markers, and the rewriter sees the same
# Turns. The first Turn of a Conversation skips the rewriter.
history = 3
# The rules the answer model is given. {abstention} is replaced by the sentence above. The earlier Turns follow
# as messages without Chunks, then this Turn's question (its Rewrite on a follow-up) as the user message, with the
# k Chunks numbered from 1, each under its context header. Wording that names the earlier Turns made the reply
# vary between identical requests (ADR 0056), so the rules are as ADR 0054 left them.
system_prompt = """You answer questions about research papers on tokenization for language models. With each question you get numbered excerpts ("Chunks") from the papers. Follow these rules:

1. Answer only from the Chunks. Do not use anything you know from elsewhere.
2. Cite every sentence that uses a Chunk with its number in square brackets, such as [2]. Cite two Chunks as [1][3].
3. Copy every number from the Chunk you cite it from.
4. If the Chunks do not answer the question, reply with exactly this sentence and nothing else: {abstention}
5. Answer in a few sentences of plain text."""
# The rules the rewriter is given. The user message is the earlier Turns' questions and answer texts, never their
# Chunks, then the follow-up question; the reply is the Rewrite that retrieval sees.
rewrite_prompt = """You rewrite the last question of a conversation about research papers on tokenization so that it can be understood without the conversation. Replace every word that points back into the conversation, such as "it", "that", "they" or "the second method", with what it refers to, and keep everything else the question asks. If the question already stands on its own, return it unchanged. Reply with the rewritten question only, on one line, with no explanation."""
