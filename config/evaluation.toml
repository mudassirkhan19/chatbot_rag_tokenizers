# Evaluation config: the Passage matching rule `eval-check` and `evaluate` share (ADR 0041).
#
# A Chunk holds a Passage when the quote's words line up with the Chunk's, in order, in matching blocks of at
# least two words (a number may match alone) within twice the quote's length, covering at least `threshold` of
# the quote, and every number in the quote is matched. Both texts are normalised first: unicode, case,
# whitespace and hyphenation, with citations dropped.
[matching]
threshold = 0.65  # the share of the quote's words that must match; calibrated in ADR 0041
edge_min_words = 6  # the words a match running into a Chunk's first or last word must cover
