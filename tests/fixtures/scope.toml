# Scope config for the offline fixture run. Same shape as config/scope.toml.

[[topics]]
id = "subword-algorithms"
description = "BPE, WordPiece, Unigram and SentencePiece"

[sources.arxiv]
page_size = 4

[[queries]]
id = "tokenizer-titles"
source = "arxiv"
topic = "subword-algorithms"
query = "ti:tokenizer OR ti:tokenization"

[sources.semantic-scholar]
fields_of_study = "Computer Science,Linguistics"

[[queries]]
id = "subword-phrases"
source = "semantic-scholar"
topic = "subword-algorithms"
query = '"subword tokenization" | sentencepiece'

# One Seed: its own record, its references and two pages of its citations.
[[seeds]]
id = "sentencepiece"
paper = "ARXIV:1808.06226"
topic = "subword-algorithms"
reason = "The standard subword tokenizer library; its citers include most later tokenizer work"

[rules]
required = ['tokeni[sz]', 'subword', 'byte[- ]pair']
# Exclusions never fire on a title that matches one of these.
keep_if_title = ['byte[- ]level']

[[rules.exclude]]
name = "token-reduction"
pattern = 'token (merging|pruning|dropping)'

[[rules.exclude]]
name = "kv-cache"
pattern = 'kv[- ]cache'

[[rules.exclude]]
name = "crypto-assets"
pattern = 'blockchain|crypto|erc-20|nft'

[judge]
model = "example/judge-model"
revision = "0123456789abcdef0123456789abcdef01234567"
threshold = 0.5
prompt = """Title: {title}

Abstract: {abstract}

Does this paper make a substantive contribution or finding about tokenization? Answer Yes or No."""

# Judge models compared on the Audit set; they share the [judge] prompt.
[[audit.models]]
model = "example/model-a"
revision = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"

[[audit.models]]
model = "example/model-b"
revision = "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
