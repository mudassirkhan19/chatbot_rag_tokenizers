[project]
name = "chatbot-rag-tokenizers"
version = "0.1.0"
description = "Grounded RAG chatbot over research papers on LLM tokenizers"
readme = "README.md"
authors = [
    { name = "Mudassir Khan", email = "mudassirkhan19@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
chatbot-rag-tokenizers = "chatbot_rag_tokenizers:main"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
judge = [
    "torch==2.14.1",
    "transformers==5.20.0",
]

[tool.uv]
# The oldest uv the repo is tested with; `just init` and uv itself refuse older ones (ADR 0021).
required-version = ">=0.10.8"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Errors and likely bugs only (pyflakes and pycodestyle's error rules); style is not enforced.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
# torch and transformers are only installed with `uv sync --group judge`.
[[tool.mypy.overrides]]
module = ["torch", "torch.*", "transformers", "transformers.*"]
ignore_missing_imports = true
